name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: fleetflow
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetflow -d fleetflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://fleetflow:fleetflow@localhost:5432/fleetflow
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
      - name: Dependency audit
        run: uv run pip-audit
      - name: OpenAPI schema is committed and current
        run: |
          uv run python manage.py spectacular --file openapi/schema.yaml --validate --fail-on-warn
          git diff --exit-code openapi/schema.yaml
