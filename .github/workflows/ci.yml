name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: fleetflow
          POSTGRES_USER: fleetflow
          POSTGRES_PASSWORD: fleetflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetflow -d fleetflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-secret
      JWT_SIGNING_KEY: ci-only-jwt-key-not-secret-but-long-enough-for-hs256
      DATABASE_URL: postgres://fleetflow:fleetflow@localhost:5432/fleetflow
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:8333
      S3_BUCKET: fleetflow
      S3_ACCESS_KEY_ID: fleetflow-access
      S3_SECRET_ACCESS_KEY: fleetflow-secret-key-local

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the changelog gate diffs against the PR base
      - name: GDAL and GEOS for GeoDjango
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      # A service container cannot take a command or a mounted config file, so run it here.
      - name: S3-compatible storage (SeaweedFS)
        run: |
          docker run -d --name storage -p 8333:8333 -p 9333:9333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.55 \
            server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9333/cluster/healthz && exit 0
            sleep 2
          done
          docker logs storage
          exit 1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (overall coverage floor 85 %)
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: Coverage of security-critical code (architecture §26.3, 95 % branch)
        run: >-
          uv run coverage report --fail-under=95
          --include="apps/*/services.py,apps/*/permissions.py,apps/*/selectors.py,apps/accounts/authentication.py,apps/accounts/lockout.py,apps/accounts/tokens.py,apps/core/idempotency.py,apps/core/storage.py,apps/uploads/files.py"
      - name: Dependency audit
        run: uv run pip-audit
      - name: OpenAPI schema is committed and current
        run: |
          uv run python manage.py spectacular --file openapi/schema.yaml --validate --fail-on-warn
          git diff --exit-code openapi/schema.yaml
      - name: Contract changes have a changelog entry (architecture §25)
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --name-only "$BASE"...HEAD | grep -qx 'openapi/schema.yaml'; then
            git diff "$BASE"...HEAD -- CHANGELOG.md | grep -qE '^\+.*(api-additive|api-breaking)' || {
              echo "::error::openapi/schema.yaml changed: add a CHANGELOG.md entry tagged api-additive or api-breaking"
              exit 1
            }
          fi
