# Local development stack (architecture §24). Not a production deployment.
x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgres://fleetflow:fleetflow@db:5432/fleetflow
    REDIS_URL: redis://redis:6379/0
    # Containers reach the bucket through the compose network; clients (curl on the host)
    # use the published port, so presigned URLs are signed for it.
    S3_ENDPOINT_URL: http://storage:8333
    S3_PUBLIC_ENDPOINT_URL: http://localhost:8333
    S3_BUCKET: fleetflow
    S3_ACCESS_KEY_ID: fleetflow-access
    S3_SECRET_ACCESS_KEY: fleetflow-secret-key-local
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  api:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_upload_bucket &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  beat:
    <<: *app
    # Schedule state lives in /tmp because the bind-mounted source is not the place for it.
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: fleetflow
      POSTGRES_USER: fleetflow
      POSTGRES_PASSWORD: fleetflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow -d fleetflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # Local S3-compatible server (memory D-API-9, D-API-25). Production uses any S3 service.
    image: chrislusf/seaweedfs:4.55
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - storagedata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  storagedata:
