    PatchedAddressWrite:
      type: object
      description: |-
        Address input. Coordinates are optional and client-supplied (memory D-API-18): send
        both `latitude` and `longitude`, or neither; on PATCH, both `null` removes them.
      properties:
        label:
          type: string
          default: ''
          maxLength: 100
        contact_name:
          type: string
          default: ''
          maxLength: 200
        phone:
          oneOf:
          - type: string
            default: ''
            pattern: ^\+[1-9]\d{1,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          default: ''
          maxLength: 100
        postal_code:
          type: string
          default: ''
          maxLength: 20
        country:
          type: string
          description: ISO 3166-1 alpha-2, e.g. DE.
          maxLength: 2
          minLength: 2
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          writeOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          writeOnly: true
          nullable: true
