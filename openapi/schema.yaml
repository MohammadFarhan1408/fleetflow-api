openapi: 3.0.3
info:
  title: FleetFlow API
  version: 0.1.0
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Endpoints reachable without a session.

        No authentication classes: a stale or expired Authorization header must not stop a
        client from logging in, refreshing or logging out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Endpoints reachable without a session.

        No authentication classes: a stale or expired Authorization header must not stop a
        client from logging in, refreshing or logging out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: |-
        Endpoints reachable without a session.

        No authentication classes: a stale or expired Authorization header must not stop a
        client from logging in, refreshing or logging out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '202':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: |-
        Endpoints reachable without a session.

        No authentication classes: a stale or expired Authorization header must not stop a
        client from logging in, refreshing or logging out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Endpoints reachable without a session.

        No authentication classes: a stale or expired Authorization header must not stop a
        client from logging in, refreshing or logging out.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
components:
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        errors:
          type: object
          additionalProperties: {}
        request_id:
          type: string
          nullable: true
      required:
      - code
      - detail
      - request_id
      - status
      - title
      - type
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 256
      required:
      - email
      - password
    Me:
      type: object
      description: Session bootstrap for clients (admin `/me`, architecture §25).
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        company:
          $ref: '#/components/schemas/MeCompany'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/MeBranch'
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - branches
      - company
      - permissions
      - roles
      - user
    MeBranch:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
      - public_id
    MeCompany:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
      - public_id
    MeUser:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
      required:
      - email
      - full_name
      - public_id
    PasswordResetConfirm:
      type: object
      properties:
        uid:
          type: string
          format: uuid
        token:
          type: string
          maxLength: 128
        new_password:
          type: string
          maxLength: 256
      required:
      - new_password
      - token
      - uid
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    RefreshToken:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    TokenPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
