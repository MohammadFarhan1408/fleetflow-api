components:
  schemas:
    Address:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        line1:
          type: string
          readOnly: true
        line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        region:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          nullable: true
          readOnly: true
        longitude:
          type: number
          format: double
          nullable: true
          readOnly: true
        geocode_confidence:
          allOf:
          - $ref: '#/components/schemas/GeocodeConfidenceEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - city
      - contact_name
      - country
      - created_at
      - geocode_confidence
      - label
      - latitude
      - line1
      - line2
      - longitude
      - phone
      - postal_code
      - public_id
      - region
      - updated_at
    AddressWrite:
      type: object
      description: |-
        Address input. Coordinates are optional and client-supplied (memory D-API-18): send
        both `latitude` and `longitude`, or neither; on PATCH, both `null` removes them.
      properties:
        label:
          type: string
          default: ''
          maxLength: 100
        contact_name:
          type: string
          default: ''
          maxLength: 200
        phone:
          oneOf:
          - type: string
            default: ''
            pattern: ^\+[1-9]\d{1,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          default: ''
          maxLength: 100
        postal_code:
          type: string
          default: ''
          maxLength: 20
        country:
          type: string
          description: ISO 3166-1 alpha-2, e.g. DE.
          maxLength: 2
          minLength: 2
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          writeOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          writeOnly: true
          nullable: true
      required:
      - city
      - country
      - line1
    Customer:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - created_at
      - email
      - kind
      - name
      - phone
      - public_id
      - updated_at
    CustomerWrite:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        name:
          type: string
          maxLength: 200
        email:
