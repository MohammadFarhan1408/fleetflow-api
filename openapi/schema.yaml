  /api/v1/shipments/:
    get:
      operationId: shipments_list
      description: |-
        List shipments in the user's branches (`shipments.view`), newest first, or create one
        (`shipments.create`, `Idempotency-Key` required).
      parameters:
      - in: query
        name: branch
        schema:
          type: string
          format: uuid
        description: Branch public ID.
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: Inclusive.
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: Exclusive.
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: customer
        schema:
          type: string
          format: uuid
        description: Sender customer public ID.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          enum:
          - normal
          - high
          - urgent
          type: string
          minLength: 1
        description: |-
          * `normal` - Normal
          * `high` - High
          * `urgent` - Urgent
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 100
          minLength: 1
        description: Prefix of the tracking number or external reference, case-insensitive.
      - in: query
        name: service_type
        schema:
          type: string
          default: ''
          maxLength: 32
          minLength: 1
      - in: query
        name: status
        schema:
          type: array
          items:
            enum:
            - draft
            - created
            - received_at_warehouse
            - sorted
            - assigned
            - loaded
            - out_for_delivery
            - delivered
            - delivery_failed
            - returning
            - returned_to_sender
            - cancelled
            type: string
            description: |-
              * `draft` - Draft
              * `created` - Created
              * `received_at_warehouse` - Received at warehouse
              * `sorted` - Sorted
              * `assigned` - Assigned
              * `loaded` - Loaded
              * `out_for_delivery` - Out for delivery
              * `delivered` - Delivered
              * `delivery_failed` - Delivery failed
              * `returning` - Returning
              * `returned_to_sender` - Returned to sender
              * `cancelled` - Cancelled
        description: Repeat to match any of several statuses.
      tags:
      - shipments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedShipmentListList'
          description: ''
    post:
      operationId: shipments_create
      description: |-
        List shipments in the user's branches (`shipments.view`), newest first, or create one
        (`shipments.create`, `Idempotency-Key` required).
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Client-generated key (e.g. a UUID); retries with it replay the
          result.
        required: true
      tags:
      - shipments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
