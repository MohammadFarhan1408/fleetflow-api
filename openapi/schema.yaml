    Transition:
      type: object
      description: |-
        A status change requested through the API. Phase 2 exposes confirm
        (`draft → created`), cancel (`→ cancelled`) and recovery (`cancelled → created`);
        other edges belong to later phases (memory D-API-21).
      properties:
        to:
          allOf:
          - $ref: '#/components/schemas/TransitionToEnum'
          description: |-
            created: confirm a draft or recover a cancelled shipment; cancelled: cancel.

            * `created` - created
            * `cancelled` - cancelled
        expected_status:
          allOf:
          - $ref: '#/components/schemas/ShipmentStatusEnum'
          description: |-
            The status the client last saw; 409 shipment.status_conflict if it changed.

            * `draft` - Draft
            * `created` - Created
            * `received_at_warehouse` - Received at warehouse
            * `sorted` - Sorted
            * `assigned` - Assigned
            * `loaded` - Loaded
            * `out_for_delivery` - Out for delivery
            * `delivered` - Delivered
            * `delivery_failed` - Delivery failed
            * `returning` - Returning
            * `returned_to_sender` - Returned to sender
            * `cancelled` - Cancelled
        reason:
          type: string
          default: ''
          description: Required to cancel or recover.
          maxLength: 500
      required:
      - expected_status
      - to
    TransitionToEnum:
      enum:
      - created
      - cancelled
      type: string
      description: |-
        * `created` - created
        * `cancelled` - cancelled
