components:
  schemas:
    ActorRef:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        full_name:
          type: string
      required:
      - full_name
      - public_id
    Address:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        contact_name:
          type: string
          readOnly: true
        phone:
          type: string
          readOnly: true
        line1:
          type: string
          readOnly: true
        line2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        region:
          type: string
          readOnly: true
        postal_code:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          nullable: true
          readOnly: true
        longitude:
          type: number
          format: double
          nullable: true
          readOnly: true
        geocode_confidence:
          allOf:
          - $ref: '#/components/schemas/GeocodeConfidenceEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - city
      - contact_name
      - country
      - created_at
      - geocode_confidence
      - label
      - latitude
      - line1
      - line2
      - longitude
      - phone
      - postal_code
      - public_id
      - region
      - updated_at
    AddressRef:
      type: object
      properties:
        address_id:
          type: string
          format: uuid
          description: Address-book entry to copy.
      required:
      - address_id
    AddressWrite:
      type: object
      description: |-
        Address input. Coordinates are optional and client-supplied (memory D-API-18): send
        both `latitude` and `longitude`, or neither; on PATCH, both `null` removes them.
      properties:
        label:
          type: string
          default: ''
          maxLength: 100
        contact_name:
          type: string
          default: ''
          maxLength: 200
        phone:
          oneOf:
          - type: string
            default: ''
            pattern: ^\+[1-9]\d{1,14}$
            maxLength: 16
          - type: string
            maxLength: 0
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          default: ''
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: string
          default: ''
          maxLength: 100
        postal_code:
          type: string
          default: ''
          maxLength: 20
        country:
          type: string
          description: ISO 3166-1 alpha-2, e.g. DE.
          maxLength: 2
          minLength: 2
        latitude:
          type: number
          format: double
          maximum: 90
          minimum: -90
          writeOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
          writeOnly: true
          nullable: true
      required:
      - city
      - country
      - line1
    Branch:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - code
      - name
      - public_id
    BranchCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 10
          pattern: ^[A-Z0-9]{2,10}$
      required:
      - code
      - name
    BranchRef:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        code:
          type: string
      required:
      - code
      - public_id
    Correction:
      type: object
      properties:
        to:
          $ref: '#/components/schemas/CorrectionToEnum'
        expected_status:
          $ref: '#/components/schemas/ShipmentStatusEnum'
        reason:
          type: string
          maxLength: 500
      required:
      - expected_status
      - reason
      - to
    CorrectionToEnum:
      enum:
      - created
      - received_at_warehouse
      - sorted
      - assigned
      - loaded
      - out_for_delivery
      - delivered
      - delivery_failed
      - returning
      - returned_to_sender
      - cancelled
      type: string
      description: |-
        * `created` - Created
        * `received_at_warehouse` - Received at warehouse
        * `sorted` - Sorted
        * `assigned` - Assigned
        * `loaded` - Loaded
        * `out_for_delivery` - Out for delivery
        * `delivered` - Delivered
        * `delivery_failed` - Delivery failed
        * `returning` - Returning
        * `returned_to_sender` - Returned to sender
        * `cancelled` - Cancelled
    Customer:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - created_at
      - email
      - kind
      - name
      - phone
      - public_id
      - updated_at
    CustomerRef:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - name
      - public_id
    CustomerWrite:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
        name:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            default: ''
          - type: string
            maxLength: 0
        phone:
          oneOf:
          - type: string
            default: ''
            pattern: ^\+[1-9]\d{1,14}$
            maxLength: 16
          - type: string
            maxLength: 0
      required:
      - kind
      - name
    Download:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Presigned GET, valid for 5 minutes.
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - url
    Driver:
      type: object
      description: |-
        Read model. The driver must come from `selectors.drivers_for_user`, which carries the
        leave annotation; the evaluated date is `context["on_date"]`.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/_DriverUser'
          readOnly: true
        branch:
          allOf:
          - $ref: '#/components/schemas/_Branch'
          readOnly: true
        phone:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DriverStatusEnum'
          readOnly: true
        status_reason:
          type: string
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        availability:
          allOf:
          - $ref: '#/components/schemas/DriverAvailability'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - availability
      - branch
      - created_at
      - phone
      - public_id
      - status
      - status_reason
      - updated_at
      - user
    DriverAvailability:
      type: object
      properties:
        date:
          type: string
          format: date
        available:
          type: boolean
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/DriverUnavailableReasonEnum'
      required:
      - available
      - date
      - reasons
    DriverCreate:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: Public ID of an existing user with the driver role.
        branch_id:
          type: string
          format: uuid
        phone:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
          maxLength: 16
      required:
      - branch_id
      - phone
      - user_id
    DriverDocument:
      type: object
      description: |-
        Read model. Context: `today` (company date, for `is_expired`) and `show_number`
        (whether the viewer holds `fleet.manage`; others get `null`, memory D-API-27).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/DriverDocumentTypeEnum'
          readOnly: true
        number:
          type: string
          nullable: true
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/LicenseCategoryEnum'
          readOnly: true
        issued_on:
          type: string
          format: date
          readOnly: true
          nullable: true
        expires_on:
          type: string
          format: date
          readOnly: true
          nullable: true
